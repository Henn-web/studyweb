function dashboard(){let total=data.history.length,avg=total?Math.round(data.history.reduce((s,x)=>s+x.percent,0)/total):0;return `<section class="panel"><h2>Dashboard pembelajaran</h2><p class="muted">Pilih mata kuliah untuk membaca materi atau mengerjakan latihan. Jumlah bank mengikuti soal yang sudah terverifikasi dan tersedia. Prioritas pengisian adalah seluruh soal asli dari BMP/modul UT; soal yang belum diverifikasi tetap diberi label latihan draf.</p><div class="grid"><div class="card"><div class="muted">Mata kuliah</div><div class="num">${names.length}</div></div><div class="card"><div class="muted">Total bank soal</div><div class="num">${names.reduce((sum,n)=>sum+BANKS[n].length,0)}</div></div><div class="card"><div class="muted">Rata-rata nilai</div><div class="num">${avg}%</div></div></div></section><section class="panel"><h2>Daftar mata kuliah</h2><div style="background:#fff8e6;border:1px solid #f1d79b;padding:13px;border-radius:10px;margin:12px 0"><b>Standar sumber soal:</b> soal BMP/modul UT akan menjadi prioritas pertama dan dicatat sampai tingkat modul serta kegiatan belajar. Soal resmi UT dari sumber lain ditempatkan setelahnya. Soal buatan hanya menjadi latihan tambahan dan tidak akan diberi label resmi.</div><div class="coursegrid">${names.map(n=>{let s=stats(n);return `<div class="course"><h3>${esc(n)}</h3><span class="pill">${BANKS[n].length} soal tersimpan</span><span class="pill">${s.sessions} sesi selesai</span><p class="muted">Rata-rata nilai: ${s.avg}% · Soal pernah digunakan: ${s.completed}/${BANKS[n].length}</p><button class="primary" onclick="startCourse('${n}')">Mulai latihan</button> <button class="secondary" onclick="openBank('${n}')">Lihat bank soal</button> <button class="secondary" onclick="openMaterials('${n}')">Materi</button></div>`}).join('')}</div></section><section class="panel"><h2>Acuan BMP dan verifikasi</h2><p class="muted">Identitas mata kuliah dan bahan ajar perlu dibedakan: kode mata kuliah tidak selalu sama dengan kode BMP. Katalog Perpustakaan UT mencantumkan STMA4111 Kalkulus Diferensial menggunakan bahan ajar MATA4110 Kalkulus I Edisi 3; MKWN4108 Bahasa Indonesia tercatat sebagai BMP edisi 1, 6 modul (2025); MSIM4304 memiliki tinjauan mata kuliah resmi 6 modul. Akses fulltext RBV memerlukan akun UT. Untuk MSIM4304, katalog dan Daftar Isi BMP tersedia melalui tautan resmi berikut.</p><p><a target="_blank" rel="noopener" href="https://pustaka.ut.ac.id/lib/msim4304-dasar-insfrastruktur-teknologi-informasi/">Katalog BMP MSIM4304</a> · <a target="_blank" rel="noopener" href="https://pustaka.ut.ac.id/lib/wp-content/uploads/pdfmk/MSIM4304-DI.pdf">Daftar Isi BMP MSIM4304</a> · <a target="_blank" rel="noopener" href="https://pustaka.ut.ac.id/lib/wp-content/uploads/pdfmk/MSIM4304-M1.pdf">Modul 1 MSIM4304</a></p><p><a target="_blank" rel="noopener" href="https://pustaka.ut.ac.id/lib/ruangbaca/prodi/55/">Daftar RBV Matematika UT</a> · <a target="_blank" rel="noopener" href="https://pustaka.ut.ac.id/lib/mkwn4108-pendidikan-kewarganegaraan/">Katalog MKWN4108</a> · <a target="_blank" rel="noopener" href="https://pustaka.ut.ac.id/lib/wp-content/uploads/pdfmk/MSIM4304-TM.pdf">Tinjauan BMP MSIM4304</a></p><p class="muted">Katalog resmi untuk STSI4101 dan MKKI4201 belum dicocokkan secara memadai pada versi ini. Karena itu, jangan anggap semua Bank soal berbasis sumber telah diverifikasi terhadap BMP.</p></section>`}
function courses(){return `<section class="panel"><h2>Semua mata kuliah</h2><p class="muted">Jumlah bank soal mengikuti sumber yang tersedia dan latihan tambahan. Satu sesi mengambil 20 soal yang belum pernah keluar sampai seluruh bank terpakai. Soal latihan bukan salinan soal ujian resmi UT.</p><div class="coursegrid">${names.map(n=>`<div class="course"><h3>${esc(n)}</h3><p><span class="pill">${BANKS[n].length} soal tersimpan</span><span class="pill">20 soal/sesi</span></p><button class="primary" onclick="startCourse('${n}')">Kerjakan soal</button> <button class="secondary" onclick="openBank('${n}')">Lihat bank soal</button> <button class="secondary" onclick="openMaterials('${n}')">Lihat materi</button></div>`).join('')}</div></section>`}
function openBank(n){data.selected=n;data.page='bank';save();render()}
function bankPage(){let n=data.selected||names[0], qs=BANKS[n]||[];let msim=n.startsWith('MSIM4304');let modules=['Pengertian dan Ruang Lingkup Infrastruktur TI','Perangkat Keras Teknologi Informasi','Perancangan dan Implementasi Jaringan','Perangkat Lunak dan Layanan Teknologi Informasi','Implementasi Virtualisasi dan Sistem Operasi','Tata Kelola dan Keamanan Teknologi Informasi'];return `<section class="panel"><button class="secondary" onclick="setPage('courses')">← Kembali ke mata kuliah</button><h2 style="margin-top:12px">Bank Soal · ${esc(n)}</h2><p class="muted">Menampilkan ${qs.length} soal. Kamu dapat mengimpor soal dari PDF/Word atau menghapus soal satu per satu.</p><div class="actions" style="margin:12px 0"><button class="primary" onclick="showImport()">＋ Upload / Import Soal</button><button class="danger secondary" style="color:#b83232" onclick="deleteAllQuestions('${n}\)">🗑 Hapus semua soal mata kuliah ini</button></div><div style="background:#fff8e6;border:1px solid #f1d79b;padding:13px;border-radius:10px;margin:12px 0"><b>Prioritas pengisian bank soal</b><ol style="margin:6px 0 0;padding-left:22px"><li>Seluruh Latihan, Tes Formatif, evaluasi, dan tugas soal yang tercantum di BMP/modul.</li><li>Soal dari sumber resmi UT lainnya, diberi label dan sumber tersendiri.</li><li>Soal tambahan buatan berdasarkan BMP, selalu diberi label latihan tambahan.</li></ol><p style="margin:8px 0 0">Soal dari file sumber: ${qs.filter(q=>q[4]?.source).length} · Latihan draf tambahan: ${qs.filter(q=>!q[4]?.source).length}</p></div><div class="grid"><div class="card"><div class="muted">Jumlah soal</div><div class="num">${qs.length}</div></div><div class="card"><div class="muted">Mode</div><div class="num" style="font-size:18px">Baca & tinjau</div></div></div>${msim?`<div class="notice" style="background:#fff8e6;border:1px solid #f1d79b;padding:12px;border-radius:10px;margin:14px 0"><b>Catatan verifikasi MSIM4304:</b> BMP resmi memiliki 6 modul. Bank ini memuat soal yang berasal dari file latihan Tes Formatif MSIM4304 yang telah dimasukkan. Soal draf lama telah dihapus. Soal dari file latihan diberi label modul dan tes, tetapi sumber latihan ini belum diverifikasi sebagai salinan resmi BMP UT. Soal draf tambahan tetap dipisahkan dari sumber.</div><h3>Cakupan resmi BMP MSIM4304</h3><ol>${modules.map(m=>`<li style="margin:6px 0">${esc(m)}</li>`).join('')}</ol>`:''}<div class="actions" style="margin:14px 0"><input id="bankSearch" type="search" placeholder="Cari soal atau kata kunci..." oninput="filterBank()" style="flex:1;min-width:220px;padding:12px;border:1px solid var(--line);border-radius:10px"><select id="bankSort" onchange="filterBank()" style="padding:12px;border:1px solid var(--line);border-radius:10px"><option value="all">Semua soal</option><option value="hidden">Belum dibuka jawabannya</option></select></div><div id="bankList">${bankItems(n,qs)}</div></section>`}
function bankItems(n,qs){return qs.map((q,i)=>{let right=q[2],letter=String.fromCharCode(65+right);return `<article class="qcard bankitem" data-search="${esc((q[0]+' '+q[1].join(' ')).toLowerCase())}" style="margin-bottom:12px"><p class="qtitle"><span style="color:var(--primary)">${i+1}.</span> ${esc(q[0])}</p><span class="pill" style="background:${q[4]?.source?'#e6f6eb':'#fff1df'};color:${q[4]?.source?'#17643a':'#8a4b08'}">${q[4]?.source?`${q[4].sourceLabel} · Modul ${q[4].module} · TF ${q[4].test}`:'Latihan draf · belum diverifikasi BMP'}</span>${q[1].map((o,j)=>`<div class="option" style="cursor:default"><span><b>${String.fromCharCode(65+j)}.</b> ${esc(o)}</span></div>`).join('')}<button class="secondary" onclick="this.nextElementSibling.classList.toggle('hidden');this.textContent=this.nextElementSibling.classList.contains('hidden')?'Lihat kunci & pembahasan':'Tutup pembahasan'">Lihat kunci & pembahasan</button><div class="feedback good hidden" style="display:block;margin-top:10px"><b>Jawaban: ${letter}. ${esc(q[1][right])}</b><br>${esc(q[3])}</div><button class="danger secondary" style="margin-top:10px;color:#b83232" onclick="deleteQuestion('${n}',${i})">Hapus soal</button></article>`}).join('')}
let importDraft=[];let importCourse='';
function showImport(){let n=data.selected||names[0];document.getElementById('app').insertAdjacentHTML('beforeend',`<div id="importModal" style="position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:16px;z-index:1000"><section class="panel" style="width:min(680px,100%);max-height:90vh;overflow:auto"><h2>Import soal dari file</h2><p class="muted">Format file yang didukung: PDF, Word (.docx), dan TXT. Sistem membaca soal bernomor dengan pilihan A–D. Kunci jawaban dapat dikenali dari bagian “Kunci Jawaban/Key”. Setelah diimpor, kamu bisa mengecek kunci setiap soal.</p><label style="display:block;margin:10px 0">Mata kuliah<select id="importCourse" style="width:100%;padding:10px;margin-top:5px">${names.map(c=>`<option value="${esc(c)}" ${c===n?'selected':''}>${esc(c)}</option>`).join('')}</select></label><label style="display:block;margin:10px 0">File soal<input id="importFile" type="file" accept=".pdf,.docx,.txt" style="width:100%;padding:10px;margin-top:5px"></label><div class="actions"><button class="primary" onclick="readImportFile()">Baca & pratinjau</button><button class="secondary" onclick="closeImport()">Batal</button></div><div id="importStatus" class="muted"></div></section></div>`)}
function closeImport(){document.getElementById('importModal')?.remove()}
async function loadLib(url,globalName){if(window[globalName])return;await new Promise((resolve,reject)=>{let sc=document.createElement('script');sc.src=url;sc.onload=resolve;sc.onerror=()=>reject(new Error('Gagal memuat library pembaca file'));document.head.appendChild(sc)})}
async function readImportFile(){let file=document.getElementById('importFile')?.files?.[0];if(!file){document.getElementById('importStatus').textContent='Pilih file terlebih dahulu.';return}let status=document.getElementById('importStatus');status.textContent='Membaca file…';try{let txt='';if(file.name.toLowerCase().endsWith('.txt'))txt=await file.text();else if(file.name.toLowerCase().endsWith('.docx')){await loadLib('https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js','mammoth');let buf=await file.arrayBuffer();let out=await mammoth.extractRawText({arrayBuffer:buf});txt=out.value}else if(file.name.toLowerCase().endsWith('.pdf')){await loadLib('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js','pdfjsLib');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';let pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;for(let p=1;p<=pdf.numPages;p++){let page=await pdf.getPage(p),content=await page.getTextContent();let rows={};content.items.forEach(it=>{let y=Math.round(it.transform?.[5]||0);(rows[y]||(rows[y]=[])).push({x:it.transform?.[4]||0,t:it.str})});txt+=Object.keys(rows).sort((a,b)=>b-a).map(y=>rows[y].sort((a,b)=>a.x-b.x).map(v=>v.t).join(' ')).join('\n')+'\n'}}else throw new Error('Format file belum didukung');importDraft=parseQuestions(txt);importCourse=document.getElementById('importCourse').value;if(!importDraft.length){status.textContent='Belum berhasil menemukan soal. Pastikan formatnya berupa nomor soal, pertanyaan, lalu pilihan A–D.';return}showImportReview(file.name)}catch(e){status.textContent='Gagal membaca file: '+e.message}}
function parseQuestions(raw){let text=raw.replace(/\r/g,'').replace(/[\u00a0]/g,' ').split('\n').map(x=>x.trim()).filter(Boolean);let keys={};let keyText=text.filter(x=>/kunci\s*(jawaban)?|answer\s*key/i.test(x)).join(' ');for(let m of keyText.matchAll(/(?:\d+\s*[.)]?\s*)?([A-D])\b/gi)){let letter=m[1].toUpperCase();}let keyPairs=[...keyText.matchAll(/(?:^|\s)(\d{1,3})\s*[.)-]?\s*([A-D])(?=\s|[,;|]|$)/gi)];keyPairs.forEach(m=>keys[+m[1]]=m[2].toUpperCase().charCodeAt(0)-65);
let qs=[],cur=null,opt=-1;function flush(){if(cur&&cur.stem.trim()&&cur.opts.filter(Boolean).length>=2){let opts=cur.opts.slice(0,4).map(x=>x.trim());while(opts.length<4)opts.push('');let correct=keys[cur.number]??0;qs.push([cur.stem.trim(),opts,correct,'Soal diimpor dari file pengguna.',{source:true,sourceLabel:'Import file',module:null,test:null,imported:true}])}cur=null;opt=-1}
for(let line of text){if(/^(kunci\s*(jawaban)?|answer\s*key|jawaban\s*[:])/i.test(line))continue;let qmatch=line.match(/^\*?\s*(?:soal\s*)?(\d{1,3})\s*[.)]\*?\s*(.*)$/i);if(qmatch){flush();cur={number:+qmatch[1],stem:qmatch[2],opts:[]};continue}let om=line.match(/^(?:[-*•]\s*)?([A-D])\s*[.)\-:]\s*(.*)$/i);if(om&&cur){opt=om[1].toUpperCase().charCodeAt(0)-65;cur.opts[opt]=om[2];continue}if(cur){if(opt>=0)cur.opts[opt]=(cur.opts[opt]||'')+' '+line;else cur.stem+=' '+line}}
flush();return qs}
function showImportReview(filename){let modal=document.getElementById('importModal');modal.innerHTML=`<section class="panel" style="width:min(920px,100%);max-height:90vh;overflow:auto"><h2>Pratinjau import</h2><p class="muted">${esc(filename)} · ${importDraft.length} soal terdeteksi. Pilih kunci jawaban untuk tiap soal sebelum disimpan.</p><div style="max-height:55vh;overflow:auto">${importDraft.map((q,i)=>`<article class="qcard" style="margin-bottom:10px"><p><b>${i+1}.</b> ${esc(q[0])}</p>${q[1].map((o,j)=>`<div class="muted">${String.fromCharCode(65+j)}. ${esc(o)}</div>`).join('')}<label style="display:block;margin-top:8px">Kunci jawaban<select id="impKey${i}" style="padding:7px">${q[1].map((o,j)=>`<option value="${j}" ${j===0?'selected':''}>${String.fromCharCode(65+j)} — ${esc(o)}</option>`).join('')}</select></label></article>`).join('')}</div><div class="actions"><button class="primary" onclick="commitImport()">Simpan ${importDraft.length} soal</button><button class="secondary" onclick="closeImport()">Batal</button></div></section>`}
function commitImport(){let course=importCourse;importDraft.forEach((q,i)=>{q[2]=Number(document.getElementById('impKey'+i).value);q[4].sourceLabel='Import file';q[3]='Diimpor dari file pengguna.'});BANKS[course].push(...importDraft);data.used[course]={};data.session[course]=data.session[course]||0;save();closeImport();render();alert(`${importDraft.length} soal berhasil ditambahkan ke ${course}.`)}
function deleteQuestion(course,index){if(!confirm('Hapus soal ini dari bank?'))return;BANKS[course].splice(index,1);data.used[course]={};save();render();}
function deleteAllQuestions(course){const total=(BANKS[course]||[]).length;if(!total){alert('Bank soal mata kuliah ini sudah kosong.');return;}if(!confirm(`Yakin ingin menghapus SEMUA ${total} soal dari ${course}? Tindakan ini tidak dapat dibatalkan.`))return;BANKS[course]=[];data.used[course]={};save();render();}
function filterBank(){let input=(document.getElementById('bankSearch')?.value||'').toLowerCase();let items=[...document.querySelectorAll('.bankitem')];let count=0;items.forEach(el=>{let ok=el.dataset.search.includes(input);el.style.display=ok?'':'none';if(ok)count++});let old=document.getElementById('bankCount');if(old)old.textContent=`Menampilkan ${count} soal`}
function materialsPage(){return `<section class="panel"><h2>Materi pembelajaran</h2><p class="muted">Pilih mata kuliah. Daftar berikut adalah peta belajar sementara. Judul dan urutan modul harus dicocokkan dengan BMP resmi masing-masing mata kuliah sebelum materi dinyatakan tervalidasi.</p><div class="coursegrid">${names.map(n=>`<div class="course"><h3>${esc(n)}</h3><p class="muted">${MATERIALS[n].length} kelompok materi</p><button class="primary" onclick="openMaterials('${n}')">Buka materi</button></div>`).join('')}</div></section>`}
function openMaterials(n){data.selected=n;data.page='materials-detail';save();document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.page==='materials'));let app=document.getElementById('app');app.innerHTML=`<section class="panel"><button class="secondary" onclick="setPage('materials')">← Kembali</button><h2 style="margin-top:12px">${esc(n)}</h2><div class="notice" style="background:#fff8e6;border:1px solid #f1d79b;padding:12px;border-radius:10px;margin:12px 0"><b>Catatan sumber:</b> soal di bank ini adalah soal latihan buatan, bukan soal resmi UT. Gunakan BMP sesuai kode mata kuliah sebagai acuan utama dan periksa kembali cakupan modul sebelum ujian.</div><p class="muted">Peta materi pembelajaran sementara. Status verifikasi judul dan urutan modul berbeda untuk setiap mata kuliah; gunakan BMP resmi sebagai acuan final. Soal bank tetap perlu audit isi secara terpisah.</p>${MATERIALS[n].map((x,i)=>`<div class="lesson"><h3>Modul ${i+1}. ${esc(x)}</h3><p class="muted">Pelajari definisi, tujuan, istilah penting, contoh penerapan, dan hubungan konsep ini dengan topik lain. Setelah membaca BMP, kerjakan latihan untuk menguji pemahaman.</p></div>`).join('')}<button class="primary" onclick="startCourse('${n}')">Latihan 20 soal</button></section>`}
function startCourse(n){let used=data.used[n]||{};let sourcePool=BANKS[n].map((q,i)=>i).filter(i=>BANKS[n][i][4]?.source&&!used[i]);let draftPool=BANKS[n].map((q,i)=>i).filter(i=>!BANKS[n][i][4]?.source&&!used[i]);let pool=sourcePool.length?sourcePool:draftPool;if(pool.length<Math.min(SESSION,BANKS[n].length)){used={};pool=BANKS[n].map((q,i)=>i)}let picked=shuffle(pool).slice(0,Math.min(SESSION,BANKS[n].length));picked.forEach(i=>used[i]=true);data.used[n]=used;data.session[n]=(data.session[n]||0)+1;quiz={course:n,session:data.session[n],questions:picked.map(i=>{let q=BANKS[n][i],opts=shuffle(q[1].map((v,j)=>({label:v,correct:j===q[2]})));return {question:q[0],options:opts,explanation:q[3],answer:null}}),submitted:false};save();renderQuiz()}
function renderQuiz(){let a=document.getElementById('app');a.innerHTML=`<section class="panel"><button class="secondary" onclick="setPage('courses')">← Mata kuliah</button><h2 style="margin-top:12px">${esc(quiz.course)} · Sesi ${quiz.session}</h2><p class="muted">${quiz.questions.length} soal pilihan ganda dari bank mata kuliah. Pilih satu jawaban untuk setiap soal.</p><span class="pill">Bank: ${BANKS[quiz.course].length} soal</span><span class="pill">Acak soal & pilihan</span><div class="progress" style="margin-top:14px"><span id="bar"></span></div><p class="muted" id="progress">0/${quiz.questions.length} dijawab</p></section><div id="questions">${quiz.questions.map((q,i)=>`<section class="qcard"><p class="qtitle"><span style="color:var(--primary)">${i+1}.</span> ${esc(q.question)}</p>${q.options.map((o,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}" onchange="answer(${i},${j})"><span><b>${String.fromCharCode(65+j)}.</b> ${esc(o.label)}</span></label>`).join('')}<div id="fb${i}" class="feedback"></div></section>`).join('')}</div><div class="actions" id="submitbox"><button class="primary" id="submit" disabled onclick="submitQuiz()">Periksa jawaban</button><button class="secondary" onclick="setPage('dashboard')">Simpan dan keluar</button></div><section class="panel hidden" id="result"></section><div class="actions hidden" id="nextbox"><button class="primary" onclick="startCourse('${quiz.course}')">Mulai sesi berikutnya</button><button class="secondary" onclick="setPage('dashboard')">Kembali ke dashboard</button></div>`;updateProgress()}
function answer(i,j){if(quiz.submitted)return;quiz.questions[i].answer=j;updateProgress()}function updateProgress(){let n=quiz.questions.filter(q=>q.answer!==null).length;document.getElementById('bar').style.width=(n/quiz.questions.length*100)+'%';document.getElementById('progress').textContent=n+'/'+quiz.questions.length+' dijawab';document.getElementById('submit').disabled=n!==quiz.questions.length}
function submitQuiz(){let correct=0;quiz.submitted=true;quiz.questions.forEach((q,i)=>{let right=q.options.findIndex(o=>o.correct),ok=q.answer===right;if(ok)correct++;let f=document.getElementById('fb'+i);f.className='feedback '+(ok?'good':'bad');f.textContent=(ok?'Benar. ':'Belum tepat. Jawaban benar: '+String.fromCharCode(65+right)+'. '+q.options[right].label+'. ')+q.explanation;document.querySelectorAll('input[name="q'+i+'"]').forEach(x=>x.disabled=true)});let percent=Math.round(correct/quiz.questions.length*100);data.history.unshift({course:quiz.course,session:quiz.session,correct,total:quiz.questions.length,percent,date:new Date().toLocaleString('id-ID')});save();let r=document.getElementById('result');r.classList.remove('hidden');r.innerHTML=`<h2>Hasil sesi ${quiz.session}</h2><div class="score">${correct}/20</div><p>${percent}% benar. ${percent>=90?'Sangat baik.':percent>=75?'Cukup baik, tinjau jawaban yang keliru.':'Pelajari kembali materi dan pembahasan sebelum sesi berikutnya.'}</p><p class="muted">Pembahasan setiap soal ditampilkan tepat di bawah pilihan jawaban.</p>`;document.getElementById('submitbox').classList.add('hidden');document.getElementById('nextbox').classList.remove('hidden');r.scrollIntoView({behavior:'smooth'})}
function historyPage(){if(!data.history.length)return `<section class="panel"><h2>Riwayat nilai</h2><div class="empty">Belum ada sesi yang diselesaikan.</div></section>`;return `<section class="panel"><h2>Riwayat nilai</h2><p class="muted">Nilai tersimpan di browser perangkat ini.</p><div style="overflow:auto"><table class="history"><thead><tr><th>Tanggal</th><th>Mata kuliah</th><th>Sesi</th><th>Benar</th><th>Nilai</th></tr></thead><tbody>${data.history.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.course)}</td><td>${x.session}</td><td>${x.correct}/${x.total}</td><td><b>${x.percent}%</b></td></tr>`).join('')}</tbody></table></div><div class="actions"><button class="secondary" onclick="if(confirm('Hapus seluruh riwayat nilai?')){data.history=[];save();render()}">Hapus riwayat nilai</button></div></section>`}
load();render();
</script><footer style="max-width:1120px;margin:20px auto;padding:0 16px 24px;color:#687386;font-size:12px">UT Learning Hub · Prioritas: soal BMP/modul UT · Status sumber ditampilkan pada setiap soal.</footer></body></html>
